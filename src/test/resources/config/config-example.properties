# octomem: конфигурация UTF-8, без подстановок и включения других файлов.
# Проверка: java -jar octomem-1.0.0.jar --check-config --config design/config-example.properties
# Размеры: k = 1024 байта, m = 1048576 байт, g = 1073741824 байта.
# Настройки CLI имеют приоритет над файлом. Аутентификации нет.

# Числовой адрес IPv4/IPv6; безопасное значение по умолчанию.
listen.address=127.0.0.1
# Порт TCP: 1..65535.
listen.port=11211
# Лимит кеша, не общий лимит памяти JVM или RSS.
memory.limit=64m
# Размер полной записи: ключ, служебные поля, значение, выравнивание.
item.maxSize=1m
# Максимальное число соединений.
connections.max=1024
# По умолчанию 2 × доступные процессоры, не менее 2.
# Чтобы сохранить вычисляемое значение на любой машине, ключ оставлен комментарием.
# Раскомментируйте следующую строку только для явного выбора двух рабочих потоков.
# transport.workers=2
# Единственная поддержанная политика вытеснения.
eviction.policy=lru
# Период фоновой очистки, секунды; положительное число.
expiry.reclaimIntervalSeconds=1
# Максимальная длина строки команды, байты.
protocol.maxLineBytes=8192
# Максимальная часть ответа, минимум 2 байта.
protocol.maxChunkBytes=64k
# Подготовленные, но не записанные байты на соединение; не предел ответа.
connections.pendingWriteBytes=8m
# Максимум декодированных, но незавершённых команд на соединение.
connections.maxInflightCommands=16
# Тайм-аут простоя, секунды; 0 отключает тайм-аут.
connections.idleTimeoutSeconds=0
# Уровень журнала: error, warn, info, debug, регистр не важен.
log.level=info
